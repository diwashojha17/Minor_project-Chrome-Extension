<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scanner Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; max-width: 480px; }
    h1 { font-size: 18px; margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; }
    input[type="text"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; margin-bottom: 16px; }
    button { padding: 8px 16px; background: #38bdf8; border: none; border-radius: 6px; color: #04202e; font-weight: 700; cursor: pointer; }
    .status { margin-top: 12px; font-size: 12px; color: #22c55e; }
  </style>
</head>
<body>
  <h1>AI Vulnerability Scanner — Settings</h1>

  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://127.0.0.1:5000" />

  <label>
    <input type="checkbox" id="allowActiveScan" /> Allow Active Scanning by default (only for sites you own)
  </label>

  <button id="saveBtn">Save Settings</button>
  <p id="statusMsg" class="status"></p>

  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
